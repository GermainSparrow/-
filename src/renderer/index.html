<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文档脱敏还原软件</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="主导航">
        <div class="brand">
          <div class="brand-mark">文</div>
          <div>
            <strong>文档脱敏还原</strong>
            <span>Desktop Console</span>
          </div>
        </div>

        <nav class="nav-list">
          <button class="nav-item active" type="button">工作台</button>
          <button class="nav-item" type="button">任务记录</button>
          <button class="nav-item" type="button">规则配置</button>
          <button class="nav-item" type="button">系统设置</button>
        </nav>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">本地安全处理</p>
            <h1>文档脱敏工作台</h1>
          </div>
          <div class="version">v<span id="app-version">0.1.0</span></div>
        </header>

        <section class="toolbar" aria-label="处理模式">
          <button class="mode-card active" type="button" data-view="sanitize">
            <span>脱敏处理</span>
            <small>不可恢复 / 可恢复实体脱敏</small>
          </button>
          <button class="mode-card" type="button" data-view="restore">
            <span>还原处理</span>
            <small>使用加密映射文件实体级还原</small>
          </button>
        </section>

        <section id="sanitize-view" class="workflow">
          <section class="panel">
            <div class="panel-header">
              <div>
                <h2>1. 导入与模式</h2>
                <p>所有处理在本机完成。旧版 DOC/XLS、扫描 PDF、含图片或嵌入对象的文件会阻断。</p>
              </div>
              <button id="select-files" class="primary-button" type="button">导入文档</button>
            </div>

            <div class="form-grid">
              <label class="field">
                <span>脱敏模式</span>
                <select id="sanitize-mode">
                  <option value="irreversible">不可恢复脱敏</option>
                  <option value="reversible">可恢复实体脱敏</option>
                </select>
              </label>
              <label class="field">
                <span>输出目录</span>
                <button id="select-output" class="secondary-button" type="button">选择输出目录</button>
              </label>
              <label class="field credential-field" hidden>
                <span>解锁方式</span>
                <select id="credential-method">
                  <option value="password">口令</option>
                  <option value="keyFile">密钥文件</option>
                </select>
              </label>
              <label id="password-field" class="field credential-field" hidden>
                <span>口令</span>
                <input id="password-input" type="password" autocomplete="off" />
              </label>
              <div id="key-file-field" class="field credential-field" hidden>
                <span>密钥文件</span>
                <button id="select-key-file" class="secondary-button" type="button">选择密钥文件</button>
              </div>
            </div>

            <div id="file-list" class="file-list compact"></div>
          </section>

          <section class="panel">
            <div class="panel-header">
              <div>
                <h2>2. 实体确认</h2>
                <p>自动识别手机号、身份证、邮箱、账号。公司、人名、地址可手动补充。</p>
              </div>
              <div class="button-row">
                <button id="preview-entities" class="secondary-button" type="button">预览识别</button>
                <button id="add-entity" class="secondary-button" type="button">新增实体</button>
              </div>
            </div>

            <div class="entity-table-wrap">
              <table class="entity-table">
                <thead>
                  <tr>
                    <th>启用</th>
                    <th>类型</th>
                    <th>原文值</th>
                    <th>脱敏值</th>
                    <th>稳定 ID</th>
                  </tr>
                </thead>
                <tbody id="entity-table-body">
                  <tr>
                    <td colspan="5" class="table-empty">导入文件并预览后显示实体。</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>

          <section class="panel action-panel">
            <div>
              <h2>3. 执行导出</h2>
              <p>不可恢复模式不会写入原文映射；可恢复模式会生成加密映射文件。</p>
            </div>
            <button id="run-sanitize" class="primary-button" type="button">执行脱敏</button>
          </section>
        </section>

        <section id="restore-view" class="workflow" hidden>
          <section class="panel">
            <div class="panel-header">
              <div>
                <h2>还原处理</h2>
                <p>只按加密映射文件进行实体级还原，无法补回已被删除的实体。</p>
              </div>
            </div>

            <div class="form-grid">
              <div class="field">
                <span>脱敏文件</span>
                <button id="select-restore-file" class="secondary-button" type="button">选择脱敏文件</button>
              </div>
              <div class="field">
                <span>映射文件</span>
                <button id="select-mapping-file" class="secondary-button" type="button">选择映射文件</button>
              </div>
              <div class="field">
                <span>输出目录</span>
                <button id="select-restore-output" class="secondary-button" type="button">选择输出目录</button>
              </div>
              <label class="field">
                <span>解锁方式</span>
                <select id="restore-credential-method">
                  <option value="password">口令</option>
                  <option value="keyFile">密钥文件</option>
                </select>
              </label>
              <label id="restore-password-field" class="field">
                <span>口令</span>
                <input id="restore-password-input" type="password" autocomplete="off" />
              </label>
              <div id="restore-key-file-field" class="field" hidden>
                <span>密钥文件</span>
                <button id="select-restore-key-file" class="secondary-button" type="button">选择密钥文件</button>
              </div>
            </div>

            <div id="restore-file-list" class="file-list compact"></div>
            <div class="action-bar">
              <button id="run-restore" class="primary-button" type="button">执行还原</button>
            </div>
          </section>
        </section>

        <section id="status-panel" class="status-panel" hidden></section>
      </main>
    </div>

    <script src="./renderer.js"></script>
  </body>
</html>
